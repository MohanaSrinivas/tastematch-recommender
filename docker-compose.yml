services:
  api:
    build: .
    ports: ["8001:8000"]
    volumes: ["./data:/app/data"]
    environment: {PYTHONPATH: /app/src}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 4s
      retries: 5
